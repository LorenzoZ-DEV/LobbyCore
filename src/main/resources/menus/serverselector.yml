config-version: 1
# Server Selector.
#
# L'ID di questo menu e il nome del file: si apre con l'azione "[MENU] serverselector".
# Per aggiungerne uno nuovo basta creare un altro file in questa cartella.
#
# TESTE DI GIOCATORE
#   material: PLAYER_HEAD + una fra:
#     username: <nome>     (il giocatore deve essere gia entrato almeno una volta)
#     base64: <stringa>    (quella dei siti di head database)
#
# SLOT
#   slot: 10          un singolo slot
#   slots: [0, 1, 2]  piu slot
#   slot: -1          riempie tutti gli slot rimasti vuoti (filler)
#
# CLICK
#   actions:                     qualsiasi click
#   left_click_actions:          solo click sinistro
#   right_click_actions:         solo click destro
#   shift_left_click_actions:    ecc.
#   Se ci sono entrambe, quella specifica vince su actions.
#
# PERMESSI
#   permission: "grado.vip"
#   hide_without_permission: true   (false = si vede ma non fa niente)
#
# AZIONI: le stesse degli item hotbar. Vedi modules/custom_join_items.yml per l'elenco.

slots: 27
title: "&8Server Selector"

# Ridisegna il menu aperto, per tenere aggiornati i contatori online.
# rate e in tick, arrotondato al secondo.
refresh:
  enabled: true
  rate: 40

